name: dealone
services:
  db:
    image: timescale/timescaledb:2.17.2-pg17
    environment:
      POSTGRES_DB: dealone
      POSTGRES_USER: dealone
      POSTGRES_PASSWORD: dealone
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U dealone"]
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    build: {context: backend, target: api}
    env_file: .env
    command: [sh, -c, "alembic upgrade head && python -m app.seed"]
    depends_on:
      db: {condition: service_healthy}
  api:
    build: {context: backend, target: api}
    env_file: .env
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  worker:
    build: {context: backend, target: worker}
    env_file: .env
    depends_on:
      api: {condition: service_healthy}
    init: true
    shm_size: 256mb
    restart: unless-stopped
  web:
    build: frontend
    ports: ["3001:80"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
volumes:
  database:
