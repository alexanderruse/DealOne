name: Diagnose cached merchant inventory
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
      VULTR_CLUSTER_ID: ${{ vars.VULTR_CLUSTER_ID }}
      KUBECONFIG: /tmp/dealone-diagnostic.kubeconfig
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Connect diagnostic client
        run: python3 scripts/vultr.py kubeconfig
      - name: Read worker warnings
        run: |
          kubectl logs deployment/worker -n dealone --tail=100 | python3 -c 'import sys; [print(line.rstrip()) for line in sys.stdin if "merchant" in line.lower() or "catalog" in line.lower()]'
      - name: Read cached inventory without requesting merchant feeds
        run: |
          kubectl exec -i deployment/api -n dealone -- python -u - <<'PY'
          from app.db import SessionLocal
          from app.catalog import public_products, requestable
          with SessionLocal() as db:
              for product in public_products(db):
                  print(product.id, product.seller, product.stock_status,
                        requestable(product), product.price_checked_at)
          PY
      - name: Remove temporary credentials
        if: always()
        run: rm -f "$KUBECONFIG"
