name: Deploy DealOne
on:
  workflow_run:
    workflows: [Checks]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Existing image commit SHA for rollback; leave blank to build current revision
        type: string
permissions:
  contents: read
concurrency:
  group: dealone-production
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
      VULTR_CLUSTER_ID: ${{ vars.VULTR_CLUSTER_ID }}
      ACME_EMAIL: ${{ vars.ACME_EMAIL }}
      VULTR_REGISTRY_ID: 369a6c53-fd50-4fe2-93d6-a151ec00c845
      VULTR_REGISTRY_ENDPOINT: ${{ vars.VULTR_REGISTRY_ENDPOINT }}
      KUBECONFIG: /tmp/dealone.kubeconfig
      DOCKER_CONFIG: /tmp/dealone-docker
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      DEMO_ADMIN_TOKEN: ${{ secrets.DEMO_ADMIN_TOKEN }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      NESSIE_API_KEY: ${{ secrets.NESSIE_API_KEY }}
      NESSIE_CUSTOMER_ID: ${{ vars.NESSIE_CUSTOMER_ID }}
      NESSIE_MERCHANT_ID: ${{ vars.NESSIE_MERCHANT_ID }}
      NESSIE_CARD_ACCOUNT_ID: ${{ vars.NESSIE_CARD_ACCOUNT_ID }}
      XAI_MODEL: ${{ vars.XAI_MODEL }}
      APP_DOMAIN: dealone.work
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM_EMAIL: ${{ vars.RESEND_FROM_EMAIL }}
      NESSIE_API_KEY: ${{ secrets.NESSIE_API_KEY }}
      NESSIE_CUSTOMER_ID: ${{ vars.NESSIE_CUSTOMER_ID }}
      NESSIE_CARD_ACCOUNT_ID: ${{ vars.NESSIE_CARD_ACCOUNT_ID }}
      NESSIE_MERCHANT_ID: ${{ vars.NESSIE_MERCHANT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: azure/setup-kubectl@v4
      - uses: azure/setup-helm@v4.3.0
        with: {version: v3.17.3}
      - name: Connect Nessie sandbox customer and merchant
        run: python3 scripts/nessie_setup.py
      - name: Validate runtime configuration
        run: |
          python3 - <<'PY'
          import os
          import sys
          sys.path.insert(0, "scripts")
          from deploy import runtime_config
          required = ("VULTR_API_KEY", "VULTR_CLUSTER_ID", "ACME_EMAIL")
          missing = [name for name in required if not os.getenv(name, "").strip()]
          if missing:
              sys.exit("Missing GitHub deployment configuration: " + ", ".join(missing))
          runtime_config()
          PY
      - name: Connect to existing Vultr cluster
        run: |
          python3 scripts/vultr.py kubeconfig
          kubectl wait --for=condition=Ready nodes --all --timeout=300s
      - name: Install or reconcile ingress and HTTPS certificates
        run: python3 scripts/bootstrap.py
      - name: Get short-lived push credentials and registry endpoint
        id: registry
        run: python3 scripts/vultr.py registry-push
      - name: Select immutable image tag
        id: revision
        env:
          ROLLBACK_TAG: ${{ inputs.image_tag }}
        run: |
          TAG="${ROLLBACK_TAG:-$(git rev-parse HEAD)}"
          if ! [[ "$TAG" =~ ^[a-f0-9]{40}$ ]]; then echo 'Expected a full commit SHA'; exit 1; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Build and push images
        if: inputs.image_tag == ''
        env:
          ENDPOINT: ${{ steps.registry.outputs.endpoint }}
          TAG: ${{ steps.revision.outputs.tag }}
        run: |
          docker buildx create --use
          docker buildx build --platform linux/amd64 --target api --tag "$ENDPOINT/dealone-api:$TAG" --push backend
          docker buildx build --platform linux/amd64 --target worker --tag "$ENDPOINT/dealone-worker:$TAG" --push backend
          docker buildx build --platform linux/amd64 --tag "$ENDPOINT/dealone-web:$TAG" --push frontend
      - name: Refresh read-only pull credentials
        run: |
          kubectl apply -f infra/k8s/namespace.yaml
          python3 scripts/vultr.py registry-pull
      - name: Synchronize Porkbun domain with load balancer
        env:
          PORKBUN_API_KEY: ${{ secrets.PORKBUN_API_KEY }}
          PORKBUN_SECRET_API_KEY: ${{ secrets.PORKBUN_SECRET_API_KEY }}
        run: python3 scripts/dns.py --apply
      - name: Migrate and roll out
        env:
          ENDPOINT: ${{ steps.registry.outputs.endpoint }}
          TAG: ${{ steps.revision.outputs.tag }}
        run: python3 scripts/deploy.py --endpoint "$ENDPOINT" --tag "$TAG"
      - name: Verify HTTPS and API
        run: |
          kubectl wait --for=condition=Ready certificate/dealone-tls -n dealone --timeout=300s
          curl --fail --retry 5 --retry-delay 5 https://dealone.work/api/health/ready
          curl --fail https://dealone.work/api/health/worker
          curl --fail https://dealone.work/health
      - name: Remove local credentials
        if: always()
        run: |
          rm -f "$KUBECONFIG" "$DOCKER_CONFIG/config.json"
