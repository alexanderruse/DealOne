name: Diagnose merchant feed (read only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
      VULTR_CLUSTER_ID: ${{ vars.VULTR_CLUSTER_ID }}
      KUBECONFIG: /tmp/dealone-diagnostic.kubeconfig
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Connect read-only diagnostic client
        run: python3 scripts/vultr.py kubeconfig
      - name: Read merchant-only worker warnings
        run: |
          kubectl logs deployment/worker -n dealone --tail=250 | python3 -c 'import sys; [print(line.rstrip()) for line in sys.stdin if "keychron" in line.lower()]'
      - name: Check approved merchant responses inside the API pod
        run: |
          kubectl exec -i deployment/api -n dealone -- python -u - <<'PY'
          import httpx
          from app.catalog import SOURCES, parse_product
          for source in SOURCES:
              try:
                  response = httpx.get('https://www.keychron.com/products/'+source[0]+'.js',params={'currency':'USD'},timeout=12)
                  print(source[0],response.status_code,response.headers.get('content-type'),response.headers.get('retry-after'))
                  if response.status_code==200:
                      payload=response.json()
                      print('Variant availability:',[(v.get('id'),v.get('available')) for v in payload.get('variants',[])])
                      record=parse_product(payload,*source)
                      print('Normalized:',record['id'],record['stock_status'],record['price_cents'])
              except Exception as error:
                  print(source[0],type(error).__name__,str(error)[:160])
          PY
      - name: Remove temporary credentials
        if: always()
        run: rm -f "$KUBECONFIG"
