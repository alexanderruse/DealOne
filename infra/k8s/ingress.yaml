apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dealone
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts: [dealone.work]
      secretName: dealone-tls
  rules:
    - host: dealone.work
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port: {number: 80}
